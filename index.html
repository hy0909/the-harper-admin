<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE HARPER 관리자</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="admin.css?v=3">
</head>
<body>

<!-- 로그인 -->
<section id="login" class="login hidden">
  <div class="login-card">
    <div class="brand">THE HARPER <span>관리자</span></div>
    <p class="muted">앱 내용을 고치려면 로그인이 필요합니다.</p>
    <form id="login-form">
      <label class="field">
        <span class="label">이메일</span>
        <input id="login-email" type="email" placeholder="name@example.com" required autocomplete="username" spellcheck="false" autocapitalize="off">
      </label>
      <label class="field">
        <span class="label">비밀번호</span>
        <input id="login-password" type="password" placeholder="비밀번호" required autocomplete="current-password">
      </label>
      <p id="login-error" class="error hidden" role="alert"></p>
      <button id="login-btn" class="btn primary wide" type="submit">로그인</button>
    </form>
    <p class="muted small login-hint">계정은 관리자가 Supabase에서 만들어 줍니다.</p>
  </div>
</section>

<!-- 앱 -->
<div id="app" class="app hidden">
  <aside class="side">
    <div class="side-top">
      <div class="brand small">THE HARPER <span>관리자</span></div>
      <a class="muted small ext" href="https://hy0909.github.io/the-harper-app/" target="_blank" rel="noopener">앱에서 보기 ↗</a>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-tab="editors">에디터<i class="dot" data-dirty="content"></i></button>
      <button class="tab" data-tab="home">메인 화면<i class="dot" data-dirty="content"></i></button>
      <button class="tab" data-tab="shops">지도 샵<i class="dot" data-dirty="shops"></i></button>
    </nav>
    <div class="side-bottom">
      <div class="user" title="로그인한 계정">
        <span id="user-login" class="small"></span>
      </div>
      <button id="logout" class="btn ghost small">로그아웃</button>
    </div>
  </aside>

  <main class="main">
    <div id="screen" class="screen"></div>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=2"></script>
<script src="js/util.js?v=2"></script>
<script src="js/db.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
<script src="js/admin.js?v=2"></script>
<script src="js/screen-editors.js?v=2"></script>
<script src="js/screen-home.js?v=3"></script>
<script src="js/screen-shops.js?v=2"></script>
</body>
</html>
